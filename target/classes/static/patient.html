<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Patient Portal | Smart Clinic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            boxShadow: {
              soft: '0 10px 30px rgba(15, 23, 42, 0.08)',
              card: '0 18px 45px rgba(2, 132, 199, 0.12)',
            },
            colors: {
              clinic: {
                50: '#f0f9ff',
                100: '#e0f2fe',
                500: '#0ea5e9',
                600: '#0284c7',
                700: '#0369a1',
                900: '#082f49',
              },
              tealmed: '#0d9488',
            }
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-800 antialiased">
    <div class="mx-auto max-w-7xl px-4 py-5 sm:px-6 lg:px-8">
      <header class="rounded-3xl border border-slate-200 bg-white/90 shadow-soft backdrop-blur-sm">
        <div class="flex items-center justify-between px-5 py-4 sm:px-8">
          <div class="flex items-center gap-3">
            <div class="flex h-11 w-11 items-center justify-center rounded-2xl bg-gradient-to-br from-clinic-600 to-tealmed text-lg font-bold text-white shadow-card">+</div>
            <div>
              <p class="text-[10px] font-semibold uppercase tracking-[0.24em] text-clinic-600">Patient Access</p>
              <h1 class="text-lg font-extrabold tracking-tight text-slate-900">Patient Portal</h1>
            </div>
          </div>
          <nav class="hidden items-center gap-8 md:flex">
            <a href="/index.html" class="text-sm font-semibold text-slate-700 transition hover:text-clinic-600">Home</a>
            <a href="/admin.html" class="text-sm font-semibold text-slate-700 transition hover:text-clinic-600">Admin</a>
            <a href="/doctor.html" class="text-sm font-semibold text-slate-700 transition hover:text-clinic-600">Doctor</a>
            <a href="/patient.html" class="text-sm font-semibold text-clinic-700">Patient</a>
          </nav>
        </div>
      </header>

      <main class="mt-8 space-y-8">
        <section class="rounded-3xl border border-slate-200 bg-white p-6 shadow-soft sm:p-8">
          <div class="flex flex-col gap-5 lg:flex-row lg:items-center lg:justify-between">
            <div>
              <p class="text-xs font-semibold uppercase tracking-[0.2em] text-clinic-600">Book a consultation</p>
              <h2 class="mt-2 text-3xl font-black tracking-tight text-slate-900">Find the right healthcare specialist</h2>
            </div>
            <button type="button" class="inline-flex items-center rounded-xl border border-slate-200 bg-slate-50 px-4 py-2 text-sm font-semibold text-slate-700 transition hover:border-clinic-200 hover:text-clinic-700">My Appointments</button>
          </div>

          <div class="mt-6 grid gap-4 lg:grid-cols-[1.3fr_0.7fr_0.4fr]">
            <div class="relative">
              <svg xmlns="http://www.w3.org/2000/svg" class="pointer-events-none absolute left-4 top-1/2 h-5 w-5 -translate-y-1/2 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M17 10a7 7 0 11-14 0 7 7 0 0114 0z" />
              </svg>
              <input id="search-doctor" type="text" placeholder="Search by doctor name or specialty" class="w-full rounded-xl border border-slate-200 bg-slate-50 py-3.5 pl-11 pr-4 text-sm text-slate-800 outline-none transition focus:border-clinic-500 focus:bg-white focus:ring-4 focus:ring-clinic-100" />
            </div>

            <select id="specialty-filter" class="rounded-xl border border-slate-200 bg-slate-50 px-4 py-3.5 text-sm text-slate-800 outline-none transition focus:border-clinic-500 focus:bg-white focus:ring-4 focus:ring-clinic-100">
              <option value="">All specialties</option>
              <option value="Cardiology">Cardiology</option>
              <option value="Dermatology">Dermatology</option>
              <option value="Pediatrics">Pediatrics</option>
              <option value="Neurology">Neurology</option>
            </select>

            <button type="button" id="search-doctors-btn" class="rounded-xl bg-gradient-to-r from-clinic-600 to-clinic-500 px-5 py-3 text-sm font-semibold text-white shadow-card transition hover:-translate-y-0.5 hover:shadow-lg">Search</button>
          </div>
        </section>

        <section class="rounded-3xl border border-slate-200 bg-white p-6 shadow-soft">
          <div class="mb-5 flex items-center justify-between">
            <div>
              <p class="text-xs font-semibold uppercase tracking-[0.2em] text-slate-500">Available doctors</p>
              <h3 class="mt-1 text-2xl font-black text-slate-900">Recommended specialists</h3>
            </div>
            <button type="button" class="rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-sm font-medium text-slate-700">Show Today</button>
          </div>

          <div id="doctor-results" class="grid gap-5 md:grid-cols-2 xl:grid-cols-3"></div>
        </section>
      </main>
    </div>

    <div id="booking-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/50 p-4">
      <div class="w-full max-w-xl rounded-3xl bg-white p-6 shadow-2xl">
        <div class="mb-6 flex items-center justify-between">
          <div>
            <p class="text-xs font-semibold uppercase tracking-[0.2em] text-clinic-600">Appointment booking</p>
            <h3 class="mt-1 text-2xl font-black text-slate-900">Book a visit</h3>
          </div>
          <button type="button" class="close-modal rounded-full bg-slate-100 p-2 text-slate-600 transition hover:bg-slate-200">✕</button>
        </div>

        <form id="booking-form" class="space-y-5">
          <div class="space-y-2">
            <label for="booking-doctor" class="text-sm font-medium text-slate-700">Doctor</label>
            <input id="booking-doctor" type="text" readonly class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-800" />
          </div>

          <div class="grid gap-5 sm:grid-cols-2">
            <div class="space-y-2">
              <label for="booking-date" class="text-sm font-medium text-slate-700">Date</label>
              <input id="booking-date" type="date" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-800 outline-none transition focus:border-clinic-500 focus:bg-white focus:ring-4 focus:ring-clinic-100" required />
            </div>
            <div class="space-y-2">
              <label for="booking-time" class="text-sm font-medium text-slate-700">Time</label>
              <select id="booking-time" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-800 outline-none transition focus:border-clinic-500 focus:bg-white focus:ring-4 focus:ring-clinic-100" required>
                <option>09:00 AM</option>
                <option>10:30 AM</option>
                <option>12:00 PM</option>
                <option>02:00 PM</option>
                <option>04:30 PM</option>
              </select>
            </div>
          </div>

          <button type="submit" class="w-full rounded-xl bg-gradient-to-r from-clinic-600 to-clinic-500 px-5 py-3 text-sm font-semibold text-white shadow-card transition hover:-translate-y-0.5 hover:shadow-lg">Confirm Appointment</button>
        </form>
      </div>
    </div>

    <script src="/js/app.js"></script>
  </body>
</html>
